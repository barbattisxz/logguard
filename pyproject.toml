[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logguard"
version = "1.0.0"
description = "Mini-WAF em Python puro: detecta ataques em logs Apache/Nginx"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
logguard = "logguard.cli:main"

[tool.setuptools]
packages = ["logguard"]
